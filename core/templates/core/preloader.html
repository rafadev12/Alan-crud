{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Wittels</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 flex flex-col items-center justify-center min-h-screen overflow-hidden select-none">

    <div class="relative flex flex-col items-center justify-center text-center px-4">
        
        <div class="relative w-36 h-36 flex items-center justify-center mb-8">
            <div class="absolute inset-0 rounded-full border-2 border-purple-500/10 border-t-2 border-t-purple-500 animate-spin duration-1000"></div>
            <div class="absolute w-32 h-32 rounded-full border-2 border-purple-900/20 border-b-2 border-b-purple-400 animate-spin duration-700 reverse-spin"></div>
            
            <span class="text-xl font-black tracking-widest text-white/90 uppercase animate-pulse">A W</span>
        </div>

        <h1 class="text-2xl md:text-3xl font-black tracking-[0.3em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-200 to-zinc-500 mb-2">
            Alan Wittels
        </h1>
        
        <p class="text-purple-500/70 text-[10px] tracking-[0.4em] uppercase font-bold animate-pulse">
            Cargando Experiencia
        </p>

    </div>

    <style>
        .reverse-spin {
            animation-direction: reverse;
        }
    </style>

    <script>
        // Espera a que cargue todo el entorno y redirige al Home después de 3 segundos
        window.addEventListener('load', function() {
            setTimeout(() => {
                window.location.href = "{% url 'home' %}";
            }, 3000); // 3000 milisegundos = 3 segundos
        });
    </script>

</body>
</html>
